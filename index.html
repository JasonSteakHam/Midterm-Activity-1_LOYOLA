<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jaymark Loyola — Designer &amp; Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="frame">
    <header class="nav">
      <a href="index.html" class="logo" aria-label="Home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <rect x="3" y="3" width="15" height="15" rx="3" class="logo-fill" />
          <rect x="14" y="14" width="15" height="15" rx="3" fill="none" class="logo-stroke" stroke-width="3" />
        </svg>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html" class="active" aria-current="page">Home</a>
        <a href="about.html" target="_blank" rel="noopener">About</a>
        <a href="contact.html" target="_blank" rel="noopener">Contact</a>
        <a href="resume.html" target="_blank" rel="noopener">Resume</a>
      </nav>
      <div class="nav-tools">
        <div class="pop-wrap">
          <button class="icon-btn dark" id="accentBtn" type="button" aria-label="Change accent colour" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 2.3"/></svg>
          </button>
          <div class="popover" id="accentPop" hidden>
            <p class="pop-title">Accent colour</p>
            <div class="swatches" id="swatches">
              <button data-accent="lime" aria-label="Lime"></button>
              <button data-accent="aqua" aria-label="Aqua"></button>
              <button data-accent="amber" aria-label="Amber"></button>
              <button data-accent="violet" aria-label="Violet"></button>
            </div>
          </div>
        </div>
        <a class="icon-btn dark" href="contact.html" target="_blank" rel="noopener" aria-label="Get in touch">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 21c1-4 4-6 7-6s6 2 7 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </a>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </header>

    <main class="layout">
      <section class="hero">
        <div class="shapes" id="shapes" aria-hidden="true"></div>
        <h1>Jaymark<br />Loyola</h1>
        <p class="hero-copy">
          Product designer and front-end developer. I design and build
          websites, apps and brand systems for small teams with big ideas.
          Based in Cebu, working worldwide.
        </p>
      </section>

      <section class="photo-side">
        <figure class="photo" id="photo">
          
          <img src="images/AI%20pic.jpg" alt="Portrait of Jaymark Loyola" />
          <figcaption class="photo-empty">Add your picture as <b>photo.jpg</b> in this folder</figcaption>
        </figure>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
